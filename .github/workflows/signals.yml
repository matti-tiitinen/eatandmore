name: Suositussignaalit (yöajo)

on:
  schedule:
    - cron: "0 1 * * *"   # noin klo 3 Suomen talviaikaa (UTC 01:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytrends==4.9.2
      - run: python scripts/nightly.py
      - name: Julkaise muutokset
        run: |
          git config user.name "eatandmore-signals"
          git config user.email "signals@users.noreply.github.com"
          git add signals data
          if git diff --cached --quiet; then echo "Ei muutoksia"; exit 0; fi
          git commit -m "Suositussignaalit $(date -u +%Y-%m-%d)"
          git push
